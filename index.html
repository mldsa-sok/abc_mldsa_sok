<title>ABC for Fault Attacks on ML-DSA</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Layout: browser-like frames, one per site view, stacked on a neutral backdrop; each frame is one screenshot. */
:root {
  --page: #E8EBEF;
  --surface: #FFFFFF;
  --soft: #F4F6F8;
  --line: #E2E6EB;
  --ink: #12161B;
  --muted: #5B6472;
  --faint: #959FAB;
  --heat: 200, 82, 60;
  --bad: #D2553C;
  --ok: #1E8C6E;
  --hinder: rgb(210, 136, 82);
  --tolerate: rgb(196, 112, 138);
  --detect: rgb(78, 121, 167);
  --bypass: rgb(121, 112, 110);
  --gen: #4D4D4D;
  --ann: #2B63D9;
  --link: #2D5FA0;
  --hl: rgba(45, 95, 160, 0.10);
  --card-bg: #FFFFFF;
  --card-fg: #12161B;
  --card-mut: #7A828F;
  --card-bd: #CFCBC2;
  --sans: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --math: "STIX Two Text", "Times New Roman", Times, serif;
  --fw: 1280px;
  --rowh: 40px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --page: #08090C; --surface: #13161A; --soft: #1A1E24; --line: #272C34; --ink: #E7EAEE; --muted: #9AA3AF; --faint: #67707E;
    --heat: 236, 118, 92; --bad: #EE7A62; --ok: #4FC09A; --hinder: rgb(226, 160, 112); --tolerate: rgb(214, 140, 164); --detect: rgb(120, 162, 212); --bypass: rgb(160, 152, 150); --gen: #C9CDD3;
    --ann: #6D9BFF; --link: #7FA8E0; --hl: rgba(127, 168, 224, 0.13);
    --card-bg: #1C2027; --card-fg: #E7EAEE; --card-mut: #8E97A4; --card-bd: #3A404A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --page: #08090C; --surface: #13161A; --soft: #1A1E24; --line: #272C34; --ink: #E7EAEE; --muted: #9AA3AF; --faint: #67707E;
  --heat: 236, 118, 92; --bad: #EE7A62; --ok: #4FC09A; --hinder: rgb(226, 160, 112); --tolerate: rgb(214, 140, 164); --detect: rgb(120, 162, 212); --bypass: rgb(160, 152, 150); --gen: #C9CDD3;
  --ann: #6D9BFF; --link: #7FA8E0; --hl: rgba(127, 168, 224, 0.13);
  --card-bg: #1C2027; --card-fg: #E7EAEE; --card-mut: #8E97A4; --card-bd: #3A404A;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--page); color: var(--ink); font: 14px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
button, select, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }

/* ---------- control strip (outside the screens) ---------- */
.ctrl { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 60; background: var(--page); border-bottom: 1px solid var(--line); }
.ctrl-in { max-width: calc(var(--fw) + 32px); margin: 0 auto; padding-inline: 16px; padding-block: 10px; display: flex; flex-wrap: wrap; gap: 10px 20px; align-items: center; font-size: 12.5px; color: var(--muted); }
.ctrl-in strong { color: var(--ink); font-weight: 600; margin-right: 4px; }
.cg { display: inline-flex; gap: 8px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 4px 10px; cursor: pointer; color: var(--muted); font-size: 12.5px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--soft); color: var(--ink); font-weight: 600; }
.chk { display: inline-flex; gap: 6px; align-items: center; cursor: pointer; }
.chk input { margin: 0; accent-color: var(--ink); }
.jump { margin-left: auto; display: inline-flex; gap: 12px; }
.jump a { color: var(--muted); text-decoration: none; }
.jump a:hover { color: var(--ink); }

/* ---------- stage ---------- */
.stage { padding-inline: 16px; padding-block: 26px 90px; display: grid; gap: 40px; justify-items: center; }
.part { width: min(var(--fw), 100%); display: grid; gap: 4px; padding-top: 18px; }
.part h2 { margin: 0; font-size: 18px; letter-spacing: -0.015em; }
.part p { margin: 0; color: var(--muted); font-size: 13px; max-width: 760px; }
.shot { margin: 0; display: grid; gap: 10px; max-width: 100%; }
.shot-label { font-size: 12px; color: var(--muted); display: flex; gap: 10px; align-items: baseline; max-width: var(--fw); flex-wrap: wrap; }
.shot-label b { color: var(--ink); font-weight: 600; font-size: 13px; }
.shot-label code { font: 11px var(--mono); background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }
.frame-scroll { overflow-x: auto; max-width: 100%; }
.frame { width: var(--fw); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.fhead { display: flex; align-items: flex-end; gap: 28px; padding: 14px 28px 0; border-bottom: 1px solid var(--line); }
.logo { font-weight: 650; letter-spacing: -0.01em; padding-bottom: 12px; font-size: 15px; white-space: nowrap; }
.tabs { display: flex; gap: 22px; margin-left: auto; }
.tabs span { color: var(--muted); padding-bottom: 11px; font-size: 13px; border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs span.on { color: var(--ink); border-bottom-color: var(--ink); font-weight: 600; }
.fbody { position: relative; padding: 24px 28px 30px; }
.fbody.fixed { height: 860px; overflow: hidden; }
.ptitle { display: grid; gap: 4px; margin-bottom: 16px; }
.ptitle h1 { font-size: 23px; line-height: 1.2; margin: 0; letter-spacing: -0.025em; font-weight: 650; }
.ptitle p { margin: 0; color: var(--muted); max-width: 860px; font-size: 14px; }

/* ---------- shared ---------- */
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 7px; border-radius: 4px; background: var(--soft); color: var(--muted); white-space: nowrap; }
.pill.cls { font: 600 11px var(--mono); color: var(--ink); }
.m { font-family: var(--math); font-size: 1.08em; }
.m b { font-weight: 700; } .m i { font-style: italic; }
.ref { color: var(--link); }
code { font: 0.9em var(--mono); }
table { border-collapse: separate; border-spacing: 0; }
.note { font-size: 12px; color: var(--muted); line-height: 1.55; margin-top: 14px; }
.note sup { font-weight: 600; color: var(--ink); }
.na { color: var(--faint); }
.vd { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: middle; flex: none; }
.vd.bad.demo { background: var(--bad); } .vd.bad.arg { background: color-mix(in srgb, var(--bad) 38%, transparent); } .vd.bad.ours { border: 2px solid var(--bad); }
.vd.ok.demo { background: var(--ok); } .vd.ok.arg { background: color-mix(in srgb, var(--ok) 36%, transparent); } .vd.ok.ours { border: 2px solid var(--ok); }
.ball { display: inline-block; width: 12px; height: 12px; border-radius: 50%; border: 1.3px solid var(--gen); vertical-align: middle; }

/* ---------- hover card ---------- */
.hc { background: var(--card-bg); color: var(--card-fg); border: 1px solid var(--card-bd); font-size: 12px; line-height: 1.45; padding: 10px 12px 9px; border-radius: 8px; width: max-content; max-width: 380px; }
.hc::before { content: ""; position: absolute; left: var(--ax, 18px); width: 9px; height: 9px; background: var(--card-bg); border-left: 1px solid var(--card-bd); border-top: 1px solid var(--card-bd); }
.hc.below::before { top: -5.5px; transform: rotate(45deg); }
.hc.above::before { bottom: -5.5px; transform: rotate(225deg); }
.hc .kv { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 4px 10px; margin-top: 7px; padding-top: 7px; border-top: 1px solid var(--card-bd); }
.hc .kv > span:nth-child(odd) { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--card-mut); padding-top: 1px; }
.hc .kv .m { font-size: 1.05em; }
.hc .foot { margin-top: 8px; font-size: 11px; color: var(--link); }
#hc { position: fixed; z-index: 100; pointer-events: none; opacity: 0; transition: opacity .1s; }
#hc.on { opacity: 1; }
.pincard { position: absolute; z-index: 30; pointer-events: none; }
.hc .h { display: flex; gap: 8px; align-items: baseline; font-weight: 600; margin-bottom: 4px; }
.hc .k { font: 600 10.5px var(--mono); padding: 0 5px; border-radius: 3px; background: color-mix(in srgb, var(--card-mut) 18%, transparent); }
.hc .v { display: flex; gap: 8px; align-items: center; margin: 2px 0; }
.hc .s { color: var(--card-mut); }
.hc .d { margin-top: 5px; }
.hc .sec { display: block; margin-top: 6px; color: var(--card-mut); font-size: 11.5px; }
.pinned { outline: none; }
.cursor { position: absolute; z-index: 31; width: 20px; height: 26px; pointer-events: none; }
body.nopins .pincard, body.nopins .cursor { display: none; }
body.nopins .pinned { outline: 0; }

/* ---------- annotations ---------- */
.story { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; margin: -24px -28px 20px; padding: 12px 28px; background: color-mix(in srgb, var(--ann) 8%, var(--surface)); border-bottom: 1px solid color-mix(in srgb, var(--ann) 25%, var(--line)); font-size: 13px; }
.story .q { font-weight: 600; color: var(--ink); flex-basis: 100%; }
.story .st { display: inline-flex; gap: 8px; align-items: center; color: var(--muted); }
.badge { display: inline-grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--ann); color: #fff; font: 700 12px var(--sans); flex: none; box-shadow: 0 0 0 3px var(--surface); }
.ann { position: absolute; z-index: 32; pointer-events: none; }
body.noann .story, body.noann .ann { display: none; }

/* ---------- toolbar / filters ---------- */
.toolbar { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
.tseg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.tseg button { border: 0; border-right: 1px solid var(--line); background: var(--surface); color: var(--muted); padding: 6px 12px; font-size: 13px; cursor: pointer; }
.tseg button:last-child { border-right: 0; }
.tseg button[aria-pressed="true"] { background: var(--soft); color: var(--ink); font-weight: 600; }
.switch { display: inline-flex; gap: 7px; align-items: center; color: var(--muted); font-size: 13px; cursor: pointer; }
.switch input { margin: 0; accent-color: var(--ink); }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; align-items: center; font-size: 13px; position: relative; }
.filters select, .filters input, .filters .menu-btn { padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); font-size: 13px; }
.filters input { width: 160px; }
.filters select.on, .filters .menu-btn.on { border-color: var(--ink); font-weight: 600; }
.menu-btn { cursor: pointer; }
.count { font-size: 12px; color: var(--muted); margin-left: auto; }
.fchips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; min-height: 26px; margin-bottom: 10px; font-size: 12px; color: var(--faint); }
.fchip { display: inline-flex; align-items: center; gap: 6px; padding: 2px 4px 2px 9px; border-radius: 999px; background: var(--ink); color: var(--surface); font-size: 12px; }
.fchip.out { background: transparent; color: var(--ink); border: 1.5px solid var(--ink); }
.fchip.out s { text-decoration-thickness: 1.5px; }
.fchip button { border: 0; background: rgba(127, 127, 127, 0.35); color: inherit; width: 18px; height: 18px; border-radius: 50%; line-height: 1; cursor: pointer; padding: 0; font-size: 12px; }
.clear { border: 0; background: none; color: var(--link); cursor: pointer; font-size: 12px; padding: 0 4px; }
.fchips .right { margin-left: auto; }
.menu { position: absolute; z-index: 25; top: 38px; width: 560px; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px 12px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 18px; }
.menu h5 { margin: 0 0 4px; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); }
.menu label { display: flex; gap: 7px; align-items: center; font-size: 12.5px; padding: 2px 0; cursor: pointer; }
.menu label input { margin: 0; accent-color: var(--ink); }
.menu label small { margin-left: auto; font: 10.5px var(--mono); color: var(--faint); }
.menu .mh { grid-column: 1 / -1; font-size: 12px; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 8px; }

/* ---------- fault map ---------- */
.listing { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
table.fm { width: 100%; font-size: 13px; }
.fm thead th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--soft); }
.fm thead th.gen { text-align: center; }
.fm td { padding: 0 12px; vertical-align: middle; border-bottom: 1px solid var(--line); }
.fm tr.ln > td { height: 36px; }
.fm tr.ln { cursor: pointer; }
.fm tr.ln:hover > td { background-color: var(--hl); }
.fm tr.ln.sel > td { box-shadow: inset 0 1px 0 rgba(var(--heat), .5), inset 0 -1px 0 rgba(var(--heat), .5); }
.fm tr.proc td { height: 34px; padding-top: 8px; font-family: var(--math); font-size: 15px; background: var(--surface); }
.fm td.num { font: 12px var(--mono); color: var(--faint); text-align: right; width: 54px; position: relative; padding-left: 16px; }
.fm td.num .heat { position: absolute; left: 0; top: 0; bottom: 0; width: 5px; }
.fm td.code { font-family: var(--math); font-size: 15px; white-space: nowrap; width: 1%; padding-right: 26px; }
.fm td.code .kw { font-weight: 700; }
.fm td.code .cmt { font: 12px var(--sans); color: var(--faint); margin-left: 12px; }
.fm .ind1 { padding-left: 2.2ch; display: inline-block; } .fm .ind2 { padding-left: 4.4ch; display: inline-block; } .fm .ind3 { padding-left: 6.6ch; display: inline-block; } .fm .ind4 { padding-left: 8.8ch; display: inline-block; }
.fm td.att { padding-top: 4px; padding-bottom: 4px; }
.fm td.cmc { white-space: nowrap; width: 1%; }
.fm td.gen { text-align: center; width: 30px; padding: 0 2px; }
.fm.nocm .cmc, .fm.nogen .gen { display: none; }
.chip { text-decoration: none; color: var(--ink); display: inline-flex; align-items: center; gap: 6px; margin: 2px 6px 2px 0; padding: 1px 8px 1px 2px; border: 1px solid var(--line); border-radius: 5px; background: var(--surface); font-size: 12px; cursor: pointer; white-space: nowrap; transition: border-color .1s, box-shadow .1s; }
.chip:hover { border-color: var(--muted); }
.chip i { font: 600 10.5px var(--mono); font-style: normal; padding: 1px 4px; border-radius: 3px; background: var(--soft); color: var(--muted); }
.chip.dim { opacity: 0.25; }
.chip.same, .cond.same { border-color: var(--link); box-shadow: 0 0 0 2px color-mix(in srgb, var(--link) 28%, transparent); }
.fm tr.detail td { background: var(--soft); padding: 14px 18px 18px 70px; font-size: 13px; color: var(--muted); }
.det-cols { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 24px; }
.who { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; font-size: 12px; overflow: hidden; }
.who .wr { display: grid; grid-template-columns: 150px 185px 88px 140px minmax(120px, 1fr) 58px; gap: 10px; padding: 5px 10px; border-bottom: 1px solid var(--line); align-items: center; color: var(--ink); line-height: 1.35; }
.who .wr:last-child { border-bottom: 0; }
.who .wh { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); font-weight: 600; }
.who small { color: var(--faint); font-size: 11px; }
.who .mut { color: var(--muted); }
.who .pill { margin-right: 4px; }
.who i.vd { display: inline-block; vertical-align: -2px; }
.det-cols > div { min-width: 0; }
.fm tr.detail td.dt { padding: 12px 16px 16px 54px; white-space: normal; }
.kick { margin: 0 0 6px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); font-weight: 600; }
.det-cols .it { padding: 3px 0; line-height: 1.45; }
.det-cols .it b.c { color: var(--ink); font: 600 11.5px var(--mono); margin-right: 6px; }
.tagc { display: inline-block; font: 600 10.5px var(--sans); padding: 1px 6px; border-radius: 4px; margin-right: 4px; line-height: 1.5; cursor: help; color: var(--tc); background: color-mix(in srgb, var(--tc) 12%, var(--surface)); }
.tagc.dt { --tc: #2D5FA0; } .tagc.tl { --tc: #1E7A62; } .tagc.hd { --tc: #9A6A12; } .tagc.bk { --tc: #6B6F78; }
.fm-legend { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; padding: 12px 14px; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); background: var(--soft); }
.fm-legend .sw { display: inline-block; width: 22px; height: 12px; border-radius: 2px; vertical-align: -2px; font: 9px var(--mono); color: var(--ink); text-align: center; line-height: 12px; }
.fm-legend .grp { display: inline-flex; gap: 6px; align-items: center; }

/* ---------- attack list ---------- */
table.al { width: 100%; font-size: 13px; }
.al th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--faint); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; vertical-align: bottom; }
.al th[data-c] { cursor: pointer; }
.al th[data-c]:hover { color: var(--ink); }
.al th.fon { color: var(--ink); box-shadow: inset 0 -3px 0 var(--ink); }
.al thead tr.g th { border-bottom: 0; padding-bottom: 0; color: var(--muted); letter-spacing: 0.06em; font-size: 10.5px; }
.al thead tr.g th.cmg { text-align: center; border-bottom: 1px solid var(--line); padding-bottom: 4px; }
.al th.cm, .al td.cm { text-align: center; width: 64px; padding-left: 2px; padding-right: 2px; }
.al td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; height: var(--rowh); }
.al tr.r:hover > td { background: var(--hl); }
.al tr.r.sel > td { background: rgba(var(--heat), 0.07); }
.al td.att { width: 200px; cursor: pointer; }
.al td.att:hover .ref { text-decoration: underline; }
.al td.att .sub, .al td.ev .sub { color: var(--faint); font-size: 11.5px; line-height: 1.25; }
.al td.att .rf { line-height: 1.3; }
.al td.att sup { color: var(--muted); font-weight: 600; margin-left: 1px; }
.al td.cl { width: 48px; }
.al td.ln { width: 46px; font: 12px var(--mono); color: var(--muted); cursor: help; }
.al td.ev { width: 128px; line-height: 1.3; }
.al td.rc { width: 120px; font-size: 12.5px; line-height: 1.3; }
.al td.rc small { font: 10.5px var(--mono); color: var(--faint); margin-right: 4px; }
.al td.nd { line-height: 1.9; }
.al td.cm { cursor: pointer; }
.al tr.clsrow td { height: 34px; padding-top: 10px; font-size: 12.5px; color: var(--muted); background: var(--surface); }
.al tr.clsrow td b.fid { font: 600 12px var(--mono); color: var(--ink); margin-right: 8px; }
.al tr.clsrow td .cn { color: var(--ink); font-weight: 600; margin-right: 10px; }
.cond { display: inline-flex; align-items: center; gap: 5px; margin: 1px 5px 1px 0; padding: 0 7px; border: 1px solid var(--line); border-radius: 999px; font-size: 12px; line-height: 20px; background: var(--surface); cursor: pointer; white-space: nowrap; }
.cond small { font: 10px var(--mono); color: var(--faint); }
.cond:hover { border-color: var(--muted); }
.cond.usual { color: var(--faint); border-style: dashed; }
.usual-more { font-size: 11.5px; color: var(--faint); cursor: help; white-space: nowrap; }
.legend3 { display: flex; flex-wrap: wrap; gap: 8px 22px; align-items: center; margin-top: 16px; padding: 11px 14px; background: var(--soft); border-radius: 6px; font-size: 12px; color: var(--muted); }
.legend3 .grp { display: inline-flex; gap: 6px; align-items: center; }
.legend3 b { color: var(--ink); font-weight: 600; margin-right: 2px; }

/* ---------- assumption panel ---------- */
.apanel { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px 8px; margin-bottom: 10px; background: var(--soft); }
.ap-head { display: flex; gap: 12px; align-items: baseline; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
.ap-head b { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink); }
.ap-head .key { margin-left: auto; display: inline-flex; gap: 12px; align-items: center; }
.ap-body { display: flex; flex-wrap: wrap; gap: 6px 5px; align-items: center; }
.ap-g { display: inline-flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.ap-l { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--faint); font-weight: 600; margin: 0 0 0 12px; }
.ap-l:first-child { margin-left: 0; }
.ach { display: inline-flex; align-items: center; gap: 5px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 0 8px; font-size: 12px; line-height: 22px; cursor: pointer; white-space: nowrap; color: var(--ink); }
.ach small { font: 10px var(--mono); color: var(--faint); }

igate one attack, comparing the key against precomputed keys from low-entropy inputs stops the third [<a class=\"cite\" href=\"#paper-amer2025PQHammerEndtoEndKey\">amer2025PQHammerEndtoEndKey<\/a>], and running key generation twice from the same <span class=\"m\">ξ<\/span> (CA1) stops transient faults, but not a flip that persists in memory.","CI2":"Storing copies of <span class=\"m\"><b>s<\/b><sub>1<\/sub><\/span> in separate memory locations (CI2 [<a class=\"cite\" href=\"#paper-islam2022SignatureCorrectionAttack\">islam2022SignatureCorrectionAttack<\/a>]) forces the attacker to flip every copy.","CA3":"Since FIPS 204 permits storing only the seed <span class=\"m\">ξ<\/span> [<a class=\"cite\" href=\"#paper-FIPS204\">FIPS204<\/a>], <span class=\"m\"><b>s<\/b><sub>1<\/sub><\/span> can also be derived for every signature (CA3).","CA5":"Alternatively, the signer can derive <span class=\"m\">ρ''<\/span> and <span class=\"m\"><b>y<\/b>'<\/span> again from <span class=\"m\">K<\/span>, <span class=\"m\">rnd<\/span> and <span class=\"m\">μ<\/span> and check that <span class=\"m\"><b>z<\/b>-c<b>s<\/b><sub>1<\/sub>=<b>y<\/b>'<\/span> (CA5).","CA4":"Including <span class=\"m\">K<\/span> and <span class=\"m\">rnd<\/span> directly in the derivation of <span class=\"m\"><b>y<\/b><\/span> (CA4 [<a class=\"cite\" href=\"#paper-bruinderink2018DifferentialFaultAttacks\">bruinderink2018DifferentialFaultAttacks<\/a>, <a class=\"cite\" href=\"#paper-jendral2024SingleTraceFaultInjection\">jendral2024SingleTraceFaultInjection<\/a>]) removes <span class=\"m\">ρ''<\/span> as a single point of failure, but deviates from FIPS 204 and does not prevent the attack by [<a class=\"cite\" href=\"#paper-elghamrawy2023MLWERLWEDifferential\">elghamrawy2023MLWERLWEDifferential<\/a>], as CA4 leaves the per-polynomial counter unchanged, whose increment this attack skips.","CA7":"Conversely, counting small pairwise differences of polynomials in <span class=\"m\"><b>z<\/b><\/span> (CA7 [<a class=\"cite\" href=\"#paper-elghamrawy2023MLWERLWEDifferential\">elghamrawy2023MLWERLWEDifferential<\/a>]) detects only this attack, which NXP patented together with a variant with a higher false-negative rate [<a class=\"cite\" href=\"#paper-schoenauer2025FaultDetectionDifferential\">schoenauer2025FaultDetectionDifferential<\/a>].","CI3":"inlining the absorption (CI3 [<a class=\"cite\" href=\"#paper-jendral2024SingleTraceFaultInjection\">jendral2024SingleTraceFaultInjection<\/a>]) and checking that the state is not empty (CI4 [<a class=\"cite\" href=\"#paper-jendral2024SingleTraceFaultInjection\">jendral2024SingleTraceFaultInjection<\/a>]) against the skipped call, loop-completion checks (CI5 [<a class=\"cite\" href=\"#paper-du2025BreakingShieldNovel\">du2025BreakingShieldNovel<\/a>]) and loop counters (CI1 [<a class=\"cite\" href=\"#paper-wang2025MindFaultyKeccak\">wang2025MindFaultyKeccak<\/a>]) against aborted loops, and checks on the seed and a redundant copy of its pointer against the redirected pointer [<a class=\"cite\" href=\"#paper-valsaraj2025WhenRandomnessIsnt\">valsaraj2025WhenRandomnessIsnt<\/a>].","CI4":"inlining the absorption (CI3 [<a class=\"cite\" href=\"#paper-jendral2024SingleTraceFaultInjection\">jendral2024SingleTraceFaultInjection<\/a>]) and checking that the state is not empty (CI4 [<a class=\"cite\" href=\"#paper-jendral2024SingleTraceFaultInjection\">jendral2024SingleTraceFaultInjection<\/a>]) against the skipped call, loop-completion checks (CI5 [<a class=\"cite\" href=\"#paper-du2025BreakingShieldNovel\">du2025BreakingShieldNovel<\/a>]) and loop counters (CI1 [<a class=\"cite\" href=\"#paper-wang2025MindFaultyKeccak\">wang2025MindFaultyKeccak<\/a>]) against aborted loops, and checks on the seed and a redundant copy of its pointer against the redirected pointer [<a class=\"cite\" href=\"#paper-valsaraj2025WhenRandomnessIsnt\">valsaraj2025WhenRandomnessIsnt<\/a>].","CI5":"inlining the absorption (CI3 [<a class=\"cite\" href=\"#paper-jendral2024SingleTraceFaultInjection\">jendral2024SingleTraceFaultInjection<\/a>]) and checking that the state is not empty (CI4 [<a class=\"cite\" href=\"#paper-jendral2024SingleTraceFaultInjection\">jendral2024SingleTraceFaultInjection<\/a>]) against the skipped call, loop-completion checks (CI5 [<a class=\"cite\" href=\"#paper-du2025BreakingShieldNovel\">du2025BreakingShieldNovel<\/a>]) and loop counters (CI1 [<a class=\"cite\" href=\"#paper-wang2025MindFaultyKeccak\">wang2025MindFaultyKeccak<\/a>]) against aborted loops, and checks on the seed and a redundant copy of its pointer against the redirected pointer [<a class=\"cite\" href=\"#paper-valsaraj2025WhenRandomnessIsnt\">valsaraj2025WhenRandomnessIsnt<\/a>].","CI6":"Random delays [<a class=\"cite\" href=\"#paper-ravi2022FiddlingTwiddleConstants\">ravi2022FiddlingTwiddleConstants<\/a>] or random start of the rejection loop (CI6) make the first iteration harder to time.","CA6":"Rejecting low-degree <span class=\"m\"><b>y<\/b><\/span> (CA6 [<a class=\"cite\" href=\"#paper-espitau2018LoopAbortFaultsLatticeBased\">espitau2018LoopAbortFaultsLatticeBased<\/a>]) fails, as zeroing a single coefficient suffices [<a class=\"cite\" href=\"#paper-ulitzsch2023LoopAbortsStrike\">ulitzsch2023LoopAbortsStrike<\/a>], and shuffling fails, as the recovery either does not need the positions of the zeroed coefficients or reads them from <span class=\"m\"><b>z<\/b><\/span> [<a class=\"cite\" href=\"#paper-ulitzsch2023LoopAbortsStrike\">ulitzsch2023LoopAbortsStrike<\/a>, <a class=\"cite\" href=\"#paper-azevedo-oliveira2025AttackMLDSAUsing\">azevedo-oliveira2025AttackMLDSAUsing<\/a>].","CI7":"Masking (CI7) thus helps only if each share is sampled in its own loop.","CI8":"In the addition, CRT lifting (CI8 [<a class=\"cite\" href=\"#paper-heinz2023CombinedFaultDPA\">heinz2023CombinedFaultDPA<\/a>]) detects the skip with high probability [<a class=\"cite\" href=\"#paper-krahmer2024CorrectionFaultAttacks\">krahmer2024CorrectionFaultAttacks<\/a>], as the fa   [...D.patents].sort((a, b) => a.assignee.localeCompare(b.assignee) || a.number.localeCompare(b.number)).forEach(p => {
    h += `<tr><td class="n"><span class="ref">${office(p.number)} ${esc(p.number)} ↗</span></td><td>${esc(p.title)}</td><td class="n">${esc(p.assignee)}</td><td class="n mut">${/B\d$/.test(p.number) ? "Granted" : "Application"}</td><td class="n mut">${esc(p.year)}</td></tr>`;
  });
  document.getElementById(id).innerHTML = h + "</tbody></table>";
}
function renderCon(id) {
  document.getElementById(id).innerHTML = ptitle("Contribute", "") + `<div class="cards">
    <div class="card"><h3>Notify us about a paper</h3><p>Know a fault attack or countermeasure for ML-DSA that is missing here? Let us know and we will classify it.</p><button class="btn" type="button" disabled>Notify us</button></div>
    <div class="card"><h3>Add data to the attack matrix</h3><p>Propose the classification of an attack yourself. We only accept entries that are backed by a public paper or preprint.</p><button class="btn" type="button" disabled>Propose an entry</button></div>
    <div class="card"><h3>Report a correction</h3><p>Spotted a wrong cell or reference? Tell us what should change and why.</p><button class="btn" type="button" disabled>Report an issue</button></div></div>
    <p class="note">Submissions open after the review period.</p>`;
}

/* ===================== views ===================== */
mkMap("v-map", { st: { filter: "all" } });
mkList("v-abc", { st: {} });
mkHw("v-hw", { st: { ev: "E" } });
INST.forEach(x => x.render());
renderImpl("v-impl"); renderPt("v-pt"); renderCon("v-con");

/* ---------- tabs (deep link with #map, #matrix, ...) ---------- */
const VIEWS = ["map", "matrix", "hardware", "implementations", "patents", "contribute"];
function show(v) {
  if (!VIEWS.includes(v)) v = "map";
  $$(".tabs button").forEach(b => b.setAttribute("aria-selected", String(b.dataset.v === v)));
  $$("main > section").forEach(s => s.hidden = s.dataset.v !== v);
  hc.classList.remove("on");
  requestAnimationFrame(() => INST.forEach(decorate));
}
$$(".tabs button").forEach(b => b.addEventListener("click", () => { history.replaceState(null, "", "#" + b.dataset.v); show(b.dataset.v); window.scrollTo({ top: 0 }); }));
show((location.hash || "#map").slice(1));
document.addEventListener("keydown", e => { if (e.key === "Escape") INST.forEach(x => { if (x.st.sel) { x.st.sel = null; x.render(); } }); });
addEventListener("resize", () => requestAnimationFrame(() => INST.forEach(decorate)));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => INST.forEach(decorate));
})();
</script>
